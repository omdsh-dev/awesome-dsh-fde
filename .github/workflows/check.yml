name: check

# 投稿时自动按 CONTRIBUTING.md 的规则检查；每周再查一遍，发现改名、归档、长期不更新的条目。
on:
  pull_request:
    paths: ["README.md", "README.zh-CN.md", "scripts/**", ".github/workflows/check.yml"]
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check entries
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python3 scripts/check.py --base "origin/$BASE_REF"
          else
            python3 scripts/check.py
          fi
